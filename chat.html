<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>J.U.L.I.E — Chat | Cosmohentorq</title>
<meta name="description" content="Chat with J.U.L.I.E — Cosmohentorq's AI. Live now, free, no sign-up."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--s1:#0a0a0a;--s2:#111;--blue:#00d4ff;--t1:#f0f0f0;--t2:rgba(255,255,255,.5);--t3:rgba(255,255,255,.28);--b2:rgba(255,255,255,.07)}
html,body{height:100%}
body{
  background:#000;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:60px 60px;
  color:var(--t1);font-family:'DM Sans','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden
}

/* top bar */
.bar{flex-shrink:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:0.5px solid var(--b2);background:rgba(0,0,0,.92);backdrop-filter:blur(20px)}
.back{color:var(--t2);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;transition:.2s}
.back:hover{color:#fff;background:rgba(255,255,255,.05)}
.bar-avatar{width:30px;height:30px;border-radius:50%;background:rgba(0,212,255,.08);border:0.5px solid rgba(0,212,255,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.core-dot{width:7px;height:7px;border-radius:50%;background:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,.8);animation:gp 2.5s ease-in-out infinite}
@keyframes gp{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.4);opacity:1}}
.bar-name{font-size:14px;font-weight:700;letter-spacing:.5px;font-family:'Bitcount Grid Single',monospace;line-height:1.1}
.bar-status{font-size:10.5px;color:#00d4ff;display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:5px;height:5px;border-radius:50%;background:#00d4ff;animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* banner (diagnostics) */
.banner{flex-shrink:0;display:none;padding:10px 16px;font-size:12.5px;line-height:1.5;background:rgba(255,77,94,.08);border-bottom:0.5px solid rgba(255,107,122,.35);color:#ff9aa5}
.banner.show{display:block}
.banner b{color:#ffd0d5}

/* log */
.log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.inner{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.msg.u{flex-direction:row-reverse}
.msg.u .av{background:#fff;color:#000}
.msg.a .av{background:rgba(0,212,255,.1);border:0.5px solid rgba(0,212,255,.35);color:#00d4ff;font-family:'Bitcount Grid Single',monospace}
.bubble{padding:11px 14px;border-radius:14px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;max-width:calc(100% - 44px)}
.msg.u .bubble{background:#fff;color:#000;border-bottom-right-radius:4px}
.msg.a .bubble{background:var(--s2);border:0.5px solid var(--b2);color:var(--t1);border-bottom-left-radius:4px;white-space:normal}
.blink{display:inline-block;width:7px;height:15px;background:#00d4ff;margin-left:1px;vertical-align:text-bottom;animation:blink 1s step-end infinite;border-radius:1px}
/* rendered markdown inside assistant bubbles */
.bubble p{margin:0 0 8px}
.bubble>*:last-child{margin-bottom:0}
.bubble strong{font-weight:700;color:#fff}
.bubble em{font-style:italic}
.bubble a{color:#00d4ff;text-decoration:underline;overflow-wrap:anywhere}
.bubble ul,.bubble ol{margin:4px 0 8px;padding-left:20px}
.bubble li{margin:3px 0}
.bubble h3,.bubble h4,.bubble h5{margin:10px 0 6px;line-height:1.3;font-weight:700}
.bubble h3{font-size:16px}.bubble h4{font-size:14.5px}.bubble h5{font-size:13.5px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:rgba(255,255,255,.08);border:0.5px solid var(--b2);border-radius:5px;padding:1px 5px}
.bubble pre{background:#0d0d0d;border:0.5px solid var(--b2);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:8px 0}
.bubble pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.5;display:block;white-space:pre}
.bubble hr{border:none;border-top:0.5px solid var(--b2);margin:10px 0}

/* suggestions */
.suggest{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.chip{font-size:12.5px;color:var(--t2);background:var(--s2);border:0.5px solid var(--b2);border-radius:20px;padding:8px 14px;cursor:pointer;font-family:inherit;transition:.2s}
.chip:hover{border-color:rgba(0,212,255,.4);color:#fff}

/* composer */
.composer{flex-shrink:0;border-top:0.5px solid var(--b2);background:rgba(0,0,0,.92);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.composer-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;background:var(--s2);border:0.5px solid var(--b2);border-radius:14px;color:var(--t1);font-family:inherit;font-size:15px;padding:12px 15px;max-height:140px;line-height:1.5;outline:none;transition:border-color .2s}
textarea:focus{border-color:rgba(0,212,255,.45)}
textarea::placeholder{color:var(--t3)}
.send{width:46px;height:46px;flex-shrink:0;border:none;border-radius:14px;background:#fff;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.send:hover{filter:brightness(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:19px;height:19px}
.disc{max-width:760px;margin:8px auto 0;text-align:center;font-size:10.5px;color:var(--t3)}
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="/" aria-label="Back to home">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <span class="bar-avatar"><span class="core-dot"></span></span>
  <div style="margin-right:auto">
    <div class="bar-name">J.U.L.I.E</div>
    <div class="bar-status"><span class="dot"></span>Online · Live now</div>
  </div>
</div>

<div class="banner" id="banner"></div>

<div class="log" id="log">
  <div class="inner" id="inner">
    <div class="msg a"><div class="av">J</div><div class="bubble">Hi — I'm J.U.L.I.E, Cosmohentorq's AI, live as of today. Ask me anything to get started. I understand English, Tamil, Tanglish and more.</div></div>
    <div class="suggest" id="suggest">
      <button type="button" class="chip">What is J.U.L.I.E?</button>
      <button type="button" class="chip">What can you help me with?</button>
      <button type="button" class="chip">Write a short poem about the stars</button>
    </div>
  </div>
</div>

<div class="composer">
  <form class="composer-inner" id="form">
    <textarea id="input" rows="1" placeholder="Message J.U.L.I.E…" autocomplete="off" aria-label="Message J.U.L.I.E"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
  <p class="disc">J.U.L.I.E can make mistakes. Please verify important information.</p>
</div>

<script>
// The model name and backend URL live ONLY on the server (/api/chat).
(function(){
  const inner=document.getElementById('inner');
  const log=document.getElementById('log');
  const form=document.getElementById('form');
  const ta=document.getElementById('input');
  const send=document.getElementById('send');
  const suggest=document.getElementById('suggest');
  const banner=document.getElementById('banner');

  const history=[];
  let busy=false;

  function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  // Minimal, safe Markdown -> HTML (escapes first, then renders a common subset).
  function mdToHtml(src){
    src=(src||'').replace(/\r\n?/g,'\n');
    const store=[];
    const stash=h=>{store.push(h);return "\uFFFC"+(store.length-1)+"\uFFFC";};
    // fenced code blocks
    src=src.replace(/```[\w-]*\n?([\s\S]*?)```/g,(m,code)=>stash('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>'));
    // inline code
    src=src.replace(/`([^`\n]+)`/g,(m,c)=>stash('<code>'+esc(c)+'</code>'));
    src=esc(src);
    // inline emphasis + links (order matters: bold before italic)
    src=src.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    src=src.replace(/__([^_]+)__/g,'<strong>$1</strong>');
    src=src.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
    src=src.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    // block level
    const out=[];let para=[],lt=null,li=[];
    const fp=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[];}};
    const fl=()=>{if(lt){out.push('<'+lt+'>'+li.join('')+'</'+lt+'>');lt=null;li=[];}};
    for(const line of src.split('\n')){
      const t=line.trim();let m;
      if(/^\uFFFC\d+\uFFFC$/.test(t)){fp();fl();out.push(t);continue;}
      if(t===''){fp();fl();continue;}
      if(/^(---+|\*\*\*+|___+)$/.test(t)){fp();fl();out.push('<hr>');continue;}
      if(m=/^(#{1,4})\s+(.*)$/.exec(t)){fp();fl();const lv=Math.min(m[1].length,3)+2;out.push('<h'+lv+'>'+m[2]+'</h'+lv+'>');continue;}
      if(m=/^[-*]\s+(.*)$/.exec(t)){fp();if(lt!=='ul'){fl();lt='ul';}li.push('<li>'+m[1]+'</li>');continue;}
      if(m=/^\d+[.)]\s+(.*)$/.exec(t)){fp();if(lt!=='ol'){fl();lt='ol';}li.push('<li>'+m[1]+'</li>');continue;}
      fl();para.push(t);
    }
    fp();fl();
    let html=out.join('');
    html=html.replace(/\uFFFC(\d+)\uFFFC/g,(m,i)=>store[+i]);   // restore code
    return html;
  }

  function scroll(){log.scrollTop=log.scrollHeight;}

  function addMsg(role,text){
    const wrap=document.createElement('div');
    wrap.className='msg '+(role==='user'?'u':'a');
    const av=document.createElement('div');av.className='av';av.textContent=role==='user'?'You':'J';
    const b=document.createElement('div');b.className='bubble';
    if(role==='assistant'){b.innerHTML=text||'<span class="blink"></span>';}else{b.textContent=text;}
    wrap.appendChild(av);wrap.appendChild(b);
    inner.appendChild(wrap);scroll();
    return {wrap,b};
  }

  function showBanner(html){banner.innerHTML=html;banner.classList.add('show');}

  // Self-diagnosis: GET /api/chat must be 405 (function is live). If it returns
  // 200 HTML, the site is on a static host and the function isn't running.
  fetch('/api/chat',{method:'GET'}).then(r=>{
    const ct=(r.headers.get('content-type')||'');
    if(r.status===200 && ct.includes('text/html')){
      showBanner('⚠ <b>Chat backend not deployed.</b> This page is being served by a static host, so <code>/api/chat</code> isn\'t running. Deploy the site on <b>Cloudflare Pages</b> (with the <code>functions/</code> folder) and point <b>julie.cosmohentorq.com</b> at it.');
    }
  }).catch(()=>{});

  function autosize(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';}
  ta.addEventListener('input',autosize);
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});

  async function ask(text){
    text=(text||'').trim();
    if(busy||!text) return;
    busy=true;send.disabled=true;
    if(suggest) suggest.remove();

    addMsg('user',text);
    history.push({role:'user',content:text});
    ta.value='';autosize();

    const {wrap,b}=addMsg('assistant','');
    let acc='';

    function fail(msg){
      b.innerHTML=esc(msg);
      b.style.color='#ff9aa5';
    }

    try{
      const res=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:history})
      });
      const ct=(res.headers.get('content-type')||'');

      // Backend not running -> HTML came back instead of a stream.
      if(ct.includes('text/html')){
        history.pop();
        fail('J.U.L.I.E\'s backend isn\'t connected yet. (The server returned a web page instead of a reply — the /api/chat function isn\'t deployed.)');
        showBanner('⚠ <b>Chat backend not deployed.</b> Serve this site on <b>Cloudflare Pages</b> with the <code>functions/</code> folder, and point julie.cosmohentorq.com at it.');
        return;
      }

      if(!res.ok){
        history.pop();
        let m='';try{m=(await res.json()).error||'';}catch(_){}
        fail(m||('J.U.L.I.E is unavailable right now (error '+res.status+'). Please try again.'));
        return;
      }

      // Non-streaming JSON fallback (some proxies buffer the stream).
      if(ct.includes('application/json')){
        const j=await res.json();
        acc=j.choices?.[0]?.message?.content||'';
        if(acc){b.innerHTML=mdToHtml(acc);history.push({role:'assistant',content:acc});}
        else{history.pop();fail('J.U.L.I.E didn\'t return a reply. Please try again.');}
        return;
      }

      // Streamed SSE (the normal path).
      const reader=res.body.getReader();
      const dec=new TextDecoder();
      let buf='';
      while(true){
        const {value,done}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        let nl;
        while((nl=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
          if(!line.startsWith('data:')) continue;
          const data=line.slice(5).trim();
          if(data==='[DONE]') continue;
          try{
            const delta=JSON.parse(data).choices?.[0]?.delta?.content||'';
            if(delta){acc+=delta;b.innerHTML=mdToHtml(acc)+'<span class="blink"></span>';scroll();}
          }catch(_){/* keep-alive / partial */}
        }
      }
      if(acc){b.innerHTML=mdToHtml(acc);history.push({role:'assistant',content:acc});}
      else{history.pop();fail('J.U.L.I.E didn\'t return a reply. Please try again.');}
    }catch(err){
      history.pop();
      fail('Couldn\'t reach J.U.L.I.E. Check your connection and try again.');
    }finally{
      busy=false;send.disabled=false;ta.focus();
    }
  }

  form.addEventListener('submit',e=>{e.preventDefault();ask(ta.value);});
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>ask(c.textContent)));
  ta.focus();
})();
</script>
</body>
</html>
